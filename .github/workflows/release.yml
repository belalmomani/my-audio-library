name: Release APK
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: فك ترميز ملف التوقيع
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - run: gradle :app:bundleRelease :app:assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: release, path: "app/build/outputs/**/*.apk\napp/build/outputs/**/*.aab" }
